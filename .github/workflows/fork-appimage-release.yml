name: LaküenApeRecomp AppImage release

# This fork's release channel: every push to linux-appimage builds LakuenApeRecomp-<version>-x86_64.AppImage
# (tools/make_release_linux.py --game dkb, as the appimage job of dkb-release.yml) and publishes it as release
# v<VERSION>.<run number>, the tag made by GitHub at the pushed commit. The build number goes into the AppImage's VERSION
# too, so the installer's update check (installer/update.py) tells a player of an older build about the newer one.

on:
  workflow_dispatch:
  push:
    branches: [linux-appimage]

permissions:
  contents: write

concurrency:
  group: fork-appimage-release
  cancel-in-progress: false

jobs:
  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # make_release.py stamps the commit into the version
      - name: Stamp the build number into VERSION
        id: version
        run: |
          version="$(cat VERSION).${GITHUB_RUN_NUMBER}"
          echo "$version" > VERSION
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld xvfb xauth
          python -m pip install pytest
      - run: python tools/check_content.py
      - name: Tests of the fork's changes   # device profiles, German menu, launcher, when-done actions, build priority
        run: |
          python tests/device_profile_test.py --cc clang
          python tests/menu_text_de_test.py --cc clang
          python -m pytest -q tests/installer_power_test.py tests/installer_update_test.py tests/installer_launch_test.py
      # The AppImage as upstream's dkb-release.yml builds it: the pinned toolchain, then the folder in the pinned
      # container, with the fork's file name
      - name: Fetch refs
        run: sh tools/fetch_refs.sh
      - name: Fetch the release toolchain
        run: python tools/make_release_linux.py --fetch-toolchain --out build/ci-toolchain
      - name: Build the self-contained AppImage in the pinned container
        run: |
          python tools/make_release_linux.py --game dkb --stub --out build/release/DKB-Setup-linux \
            --appimage "build/release/LakuenApeRecomp-${{ steps.version.outputs.version }}-x86_64.AppImage" --ci-container
      - name: Smoke-test the AppImage
        env:
          DKB_SETUP_HOME: ${{ runner.temp }}/dkb-setup
        run: xvfb-run -a ./build/release/LakuenApeRecomp-*-x86_64.AppImage --appimage-extract-and-run --selftest
      - uses: actions/upload-artifact@v4
        with:
          name: LakuenApeRecomp-AppImage
          path: build/release/LakuenApeRecomp-*-x86_64.AppImage
          if-no-files-found: error

  publish:
    needs: appimage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4   # the notes
      - uses: actions/download-artifact@v4
        with:
          name: LakuenApeRecomp-AppImage
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.appimage.outputs.version }}
        run: |
          (cd dist && sha256sum LakuenApeRecomp-*.AppImage > SHA256SUMS.txt)
          gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "LaküenApeRecomp $VERSION" --notes-file .github/appimage-release-notes.md
