name: LaküenApeRecomp AppImage release

# This fork's release channel: every push to linux-appimage builds LakuenApeRecomp-<version>-x86_64.AppImage
# (tools/make_release_linux.py --game dkb, as the appimage job of dkb-release.yml) and publishes it as release
# v<VERSION>.<run number>, the tag made by GitHub at the pushed commit. The build number goes into the AppImage's VERSION
# too, so the installer's update check (installer/update.py) tells a player of an older build about the newer one.

on:
  workflow_dispatch:
  push:
    branches: [linux-appimage]

permissions:
  contents: write

concurrency:
  group: fork-appimage-release
  cancel-in-progress: false

jobs:
  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # make_release.py stamps the commit into the version
      - name: Stamp the build number into VERSION
        id: version
        run: |
          version="$(cat VERSION).${GITHUB_RUN_NUMBER}"
          echo "$version" > VERSION
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Free disk space   # the LLVM release archive and the sniper SDK need several GB
        run: sudo rm -rf /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4   # build_xlate.py links totk_xlate with NativeAOT against the sniper sysroot
        with:
          dotnet-version: "10.0.x"
      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make pkg-config binutils xvfb xauth fonts-dejavu-core clang lld
          python -m pip install pillow pytest
      - run: python tools/check_content.py
      - name: Tests of the fork's changes   # device profiles, German menu, launcher, when-done actions, build priority, file chooser
        run: |
          python tests/device_profile_test.py --cc clang
          python tests/menu_text_de_test.py --cc clang
          python -m pytest -q tests/installer_power_test.py tests/installer_update_test.py tests/installer_launch_test.py
      - run: xvfb-run -a python tools/make_release_linux.py --game dkb --appimage
      - uses: actions/upload-artifact@v4
        with:
          name: LakuenApeRecomp-AppImage
          path: build/release/LakuenApeRecomp-*-x86_64.AppImage
          if-no-files-found: error

  publish:
    needs: appimage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4   # the notes
      - uses: actions/download-artifact@v4
        with:
          name: LakuenApeRecomp-AppImage
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.appimage.outputs.version }}
        run: |
          (cd dist && sha256sum LakuenApeRecomp-*.AppImage > SHA256SUMS.txt)
          gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "LaküenApeRecomp $VERSION" --notes-file .github/appimage-release-notes.md
